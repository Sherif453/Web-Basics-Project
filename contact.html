<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact - Scentique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button onclick="toggleMenu()">☰ Menu</button>
  <div id="sideMenu" class="side-menu">
    <a href="index.html">Home</a><br>
    <a href="about.html">About</a><br>
    <a href="shop.html">Shop</a><br>
    <a href="contact.html">Contact</a><br>
    <a href="login.php">Login</a><br />
    <a href="register.php">Register</a><br />
    <a href="faq.html">FAQ</a>
  </div>

  <button onclick="toggleTheme()">🌗 Toggle Dark Mode</button>

  <h2>Contact Us</h2>
  <form>
    <label for="name">Name</label>
    <input type="text" id="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="message">Message</label>
    <textarea id="message" rows="5" required></textarea>

    <label for="password">Password</label>
    <input type="password" id="password" required>
    <div id="strength" style="font-weight: bold;"></div>

    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.querySelector("form");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const messageInput = document.getElementById("message");
    const passwordInput = document.getElementById("password");
    const strengthDisplay = document.getElementById("strength");

    passwordInput.addEventListener("input", () => {
      const val = passwordInput.value;
      let strength = "Weak";
      if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) {
        strength = "Strong";
      } else if (val.length >= 6) {
        strength = "Medium";
      }
      strengthDisplay.textContent = "Strength: " + strength;
    });

    form.addEventListener("submit", (e) => {
      if (!nameInput.value || !emailInput.value || !messageInput.value || !passwordInput.value) {
        alert("Please fill all fields.");
        e.preventDefault();
      } else if (!emailInput.value.includes("@")) {
        alert("Invalid email.");
        e.preventDefault();
      }
    });

    function toggleMenu() {
      document.getElementById("sideMenu").classList.toggle("open");
    }
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
    }
  </script>
</body>
</html>
