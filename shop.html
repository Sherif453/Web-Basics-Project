<body>
  <h1>Scentique</h1>
  <button onclick="toggleMenu()">☰ Menu</button>
  <div id="sideMenu" class="side-menu">
    <a href="index.html">Home</a><br />

  </div>

  <button onclick="toggleTheme()">🌗 Toggle Dark Mode</button>

  <div class="container">
    <h2>Shop Our Collection</h2>
    <div class="grid">
      <div class="card">
        <img
          src="images/Velvet Rose Shop.jpeg"
          alt="Velvet Rose"
          style="width: 100%; height: 75%; border-radius: 10px;"
        />
        <h3>Velvet Rose</h3>
        <p>$29.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img
          src="images/Golden Hour Shop.jpeg"
          alt="Golden Hour"
          style="width: 100%; height: 75%; border-radius: 10px;"
        />
        <h3>Golden Hour</h3>
        <p>$39.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img
          src="images/Amber Mist Shop.jpeg"
          alt="Amber Mist"
          style="width: 100%; height: 75%; border-radius: 10px;"
        />
        <h3>Amber Mist</h3>
        <p>$34.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img

  <footer>&copy; 2025 Scentique. All rights reserved.</footer>

  <!-- Back to Top Button -->
  <button onclick="backToTop()" id="backToTopBtn" title="Go to top">↑ Top</button>

  <script>
    function toggleMenu() {
      document.getElementById("sideMenu").classList.toggle("open");
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
    }

    const backToTopBtn = document.getElementById("backToTopBtn");

    window.onscroll = function () {
      if (
        document.body.scrollTop > 700||
        document.documentElement.scrollTop > 700
      ) {
        backToTopBtn.style.display = "block";
      } else {
        backToTopBtn.style.display = "none";
      }
    };

    function backToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
